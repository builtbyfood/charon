# Charon tip of the day. Community-extendable: add `- tip: … / note: …` entries.
- tip: "!!"
  note: "Repeat the last command. `sudo !!` re-runs it as root."
- tip: "cd -"
  note: "Jump back to the previous working directory."
- tip: "Ctrl+R"
  note: "Reverse-search your shell history; keep pressing to go further back."
- tip: "^old^new"
  note: "Re-run the last command with the first 'old' replaced by 'new'."
- tip: "!$"
  note: "The last argument of the previous command (e.g. `mkdir dir && cd !$`)."
- tip: "xargs -P4 -n1"
  note: "Run up to 4 jobs in parallel, one argument each."
- tip: "ss -tlnp"
  note: "List listening TCP sockets with the owning process (replaces netstat)."
- tip: "journalctl -u nginx -f"
  note: "Follow a systemd unit's logs live; add --since '10 min ago'."
- tip: "systemctl status --failed"
  note: "Show units that failed to start."
- tip: "nmcli device wifi list"
  note: "Scan and list Wi-Fi networks from the terminal."
- tip: "cd ~-"
  note: "The previous directory, usable in paths: `cp file ~-/`."
- tip: "!:gs/foo/bar"
  note: "Re-run the last command replacing every 'foo' with 'bar'."
- tip: "watch -d -n1 'cmd'"
  note: "Re-run a command every second and highlight what changed."
- tip: "grep -rn --include='*.rs' pattern"
  note: "Recursive, line-numbered grep limited to Rust files."
- tip: "tar xf archive.tar.gz"
  note: "Modern tar auto-detects the compression; no -z/-j needed."
- tip: "du -sh * | sort -h"
  note: "Sizes of everything here, human-sorted."
- tip: "ip -br a"
  note: "Brief one-line-per-interface address listing."
- tip: "chmod --reference=a b"
  note: "Copy file a's permission bits onto file b."
- tip: "Ctrl+X Ctrl+E"
  note: "Open the current command line in $EDITOR to edit a long command."
- tip: "fc -s"
  note: "Re-run the last command; `fc` alone opens history in your editor."
