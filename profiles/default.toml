# Charon profile. Profiles are appearance + behaviour; connections live in charon.db
# (exportable to TOML for git sync). Copy this file to make a work/home/customer profile.

name = "default"

[appearance]
font = "JetBrains Mono"         # default terminal font; a connection can set its own (font / font_size)
font_size = 13                  # Ctrl+= / Ctrl+- write back here
theme = "charon-dark"           # "charon-light", or "system" to follow the OS (Settings → Appearance)
scrollback = 50000
renderer = "auto"               # DOM on Linux (WebKitGTK), WebGL elsewhere; or "webgl" / "canvas" / "dom" (Settings → Terminal)

[terminal]
timestamps = false              # gutter with the time each line was printed ("time" switch in the status bar)
trace_output = false            # diagnostics: log output emit/receive/paint times (also CHARON_TRACE_OUTPUT=1)
copy_on_select = false          # Linux folks may want true
ctrl_c_copies_when_selected = true
middle_click_paste = true
right_click = "moba"            # "moba": copy selection / paste, Shift+right-click for the menu; "menu": always the menu
bracketed_paste = true
paste_guard_lines = 2           # warn when pasting >= this many lines
paste_run = "auto"              # "auto": pasted text ending in a newline runs; "wait": bash highlights it, press Enter
linux_repaint = "off"           # Linux: repaint after output if the screen only updates on input; "off" | "draw" | "resize" | "nudge"

[clipboard]
strip_zero_width = true
nbsp_to_space = true
smart_quotes_to_ascii = true
trim_trailing_whitespace = true
crlf_to_lf = true

[files]
auto_open = true                # file pane opens with every SSH / local tab (Ctrl+Shift+E toggles)
parallel_transfers = 4          # max files transferring at once during a recursive / multi-item transfer
pane_width = 420                # dragged divider beside the terminal writes back here (double-click resets)
hidden_columns = []             # "size" / "mtime" / "mode" hidden from the header's right-click menu
column_widths = {}              # px by column, e.g. { name = 300, size = 72 }; no name = Name fills

[ssh]
keepalive_seconds = 30          # server-alive interval; 0 = off. No idle-disconnect timeout.

[sudo]
auto_send = false               # true: auto-send the saved password at a sudo/su prompt (300 ms debounce); else button / Ctrl+Shift+P

[broadcast]                     # MultiExec (Ctrl+Shift+B)
idle_off_minutes = 10           # broadcast switches itself off after this long without input; 0 = never
confirm = true                  # Enter on a command starting with one of these asks first while broadcasting
confirm_prefixes = ["rm", "dd", "mkfs", "shutdown", "reboot", "poweroff", "halt", "systemctl stop"]

[local]
credential = ""                 # vault entry whose password the bare Local shell offers to sudo (Unix); saved local nodes use their own credential
mcp_tier = "read"               # MCP tier of the bare Local shell; Local (admin) stays "read" unless its saved node says otherwise

[commands]                      # OSC 133 driven
mark_gutter = true
tint_failed_commands = true
jump_keys = ["Ctrl+Up", "Ctrl+Down"]

[ui]
sidebar_width = 260             # dragged splitter writes back here
restore_tabs = true             # reopen the tabs that were open at quit

[docs]
tldr_offline = true
remote_man = true
tip_of_the_day = true

[mcp]
enabled = false                 # phase 3
port = 0                         # 0 = random free port; token is per-launch (Settings → MCP)
default_tier = "read"
