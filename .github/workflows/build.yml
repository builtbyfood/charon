name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # tauri-action / gh release need this to draft releases on tags

jobs:
  # On a v* tag: create the draft release once, up front. Letting each parallel
  # tauri-action job create it races and can leave duplicate drafts.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases"             -f tag_name="${{ github.ref_name }}" -f name="Charon ${{ github.ref_name }}"             -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    needs: release
    # Run on plain pushes/PRs too, where `release` is skipped.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            label: windows
          - os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm } # 22.18+ runs the node:test TypeScript suites

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Linux deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          # libudev-dev: serialport; libwebkit2gtk-4.1: the webview; patchelf/rpm: AppImage/rpm bundlers.
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - name: Frontend check
        run: npm run check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend tests
        run: npm test

      # releaseId is empty on non-tag runs → build only, no release upload.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}

      # Portable builds: bare binary + portable.flag, no installer.
      - name: Portable (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item src-tauri/target/release/charon.exe portable/
          New-Item portable/portable.flag -ItemType File | Out-Null
          Compress-Archive portable/* charon-windows-portable.zip

      - name: Portable (Linux)
        if: matrix.label == 'linux'
        run: |
          mkdir -p portable/charon
          cp src-tauri/target/release/charon portable/charon/
          touch portable/charon/portable.flag
          tar -C portable -czf charon-linux-portable.tar.gz charon

      # Attach the portable artefacts to the draft release when building a tag.
      - name: Attach portable to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # By release id: a draft's tag doesn't exist yet, so don't look it up by tag.
          for f in charon-windows-portable.zip charon-linux-portable.tar.gz; do
            [ -f "$f" ] || continue
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream"               --data-binary @"$f"               "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets?name=$f"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: charon-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            charon-windows-portable.zip
            charon-linux-portable.tar.gz
          if-no-files-found: ignore

  # macOS: one job per architecture, both on the Apple Silicon runner (GitHub
  # retired the macos-13 Intel image); Intel is cross-compiled with --target.
  # Builds on every push/PR; attaches a .dmg to the release only on a v* tag.
  macos:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            target: aarch64-apple-darwin
          - label: macos-intel
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }

      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri, key: "${{ matrix.target }}" }

      - run: npm ci

      - name: Frontend check
        run: npm run check

      - name: Rust tests # native (arm64) run; the Intel binary is cross-built below
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend tests
        run: npm test

      # aarch64 / x86_64 .dmg. On a v* tag it is attached to the draft release;
      # on a plain push/PR it just builds (empty releaseId → no release).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles dmg
          releaseId: ${{ needs.release.outputs.id }}

      - uses: actions/upload-artifact@v5
        with:
          name: charon-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
